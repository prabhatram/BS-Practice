<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center"> FAQ Accordion</h1>
        <div class="accordion" id="faqAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header"></h2>
                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#faq1">
                    What is your return policy?
                </button>
                <div class="accordion-collapse collapse " id="faq1" data-bs-parent="#faqAccordion">
                    <div class="accordion-body">
                        You can return any item within 30 days for a full refund. Items must be unused and in original packaging.
                    </div>
                </div>

            </div>


            <div class="accordion-item">
                <h2 class="accordion-header"></h2>
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#faq2">
                    Where is my package?
                </button>
                <div class="accordion-collapse collapse" data-bs-parent="#faqAccordion" id="faq2">
                    <div class="accordion-body">
                        Please give 3-4 working days since your date of order for the package to arrive.
                    </div>
                </div>

            </div>

        </div>

    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
