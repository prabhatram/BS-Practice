<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sliding Sidebar Navigation</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 70px;
      background-color: #0d6efd;
      overflow: hidden;
      transition: width 0.3s ease;
      z-index: 1000;
    }

    .sidebar:hover {
      width: 220px;
    }

    .sidebar .brand {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 1rem;
      color: white;
      font-size: 1.25rem;
      font-weight: bold;
      white-space: nowrap;
    }

    .sidebar .nav-link {
      color: white;
      padding: 1rem;
      white-space: nowrap;
    }

    .sidebar .nav-link:hover {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .link-text {
      opacity: 0;
      margin-left: 0.75rem;
      transition: opacity 0.2s ease;
    }

    .sidebar:hover .link-text {
      opacity: 1;
    }

    .main-content {
      margin-left: 70px;
      padding: 2rem;
      transition: margin-left 0.3s ease;
    }

    .sidebar:hover ~ .main-content {
      margin-left: 220px;
    }
  </style>
</head>

<body>

  <nav class="sidebar">
    <div class="brand">
      <span>G</span>
      <span class="link-text">GhibliSite</span>
    </div>

    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" href="#">
          <span>H</span>
          <span class="link-text">Home</span>
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="#">
          <span>A</span>
          <span class="link-text">About</span>
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="#">
          <span>M</span>
          <span class="link-text">Movies</span>
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="#">
          <span>C</span>
          <span class="link-text">Contact</span>
        </a>
      </li>
    </ul>
  </nav>

  <main class="main-content">
    <div class="container-fluid">
      <h1>Sliding Left Sidebar</h1>
      <p class="lead">
        Hover over the left sidebar to reveal the navigation links.
      </p>

      <div class="card p-4">
        <h2>Page Content</h2>
        <p>
          The main content moves to the right when the sidebar expands.
        </p>
      </div>
    </div>
  </main>

</body>
</html>
